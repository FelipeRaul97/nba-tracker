<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Forescore — tracker</title>
<style>
.viz-root {
  color-scheme: light;
  --page: #f6f5f2; --surface-1: #fcfcfb; --surface-2: #f0efec; --border: #dddcd6; --border-2: #c9c8c1;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #6f6e68;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
  --div-pos: #2a78d6; --div-neg: #e34948; --div-mid: #f0efec;
  --div-pos-2: #9ec5f4; --div-neg-2: #f4b0ad;
  --good: #006300; --good-bg: #e6f3e1; --bad: #b42d2d; --bad-bg: #fcebeb; --warn: #8a5300; --warn-bg: #fbf0dc;
  --grid: #e6e5e0; --ref: #a9a8a2; --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --page: #121211; --surface-1: #1a1a19; --surface-2: #242422; --border: #353532; --border-2: #4a4a46;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #96958c;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
    --div-pos: #3987e5; --div-neg: #e66767; --div-mid: #383835; --div-pos-2: #1c5cab; --div-neg-2: #8f3434;
    --good: #5fd35f; --good-bg: #16261a; --bad: #f08f8f; --bad-bg: #2c1717; --warn: #f2bf62; --warn-bg: #2b2210;
    --grid: #2c2c2a; --ref: #6b6a64; --accent: #3987e5;
  }
}
:root[data-theme="dark"] .viz-root {
  color-scheme: dark;
  --page: #121211; --surface-1: #1a1a19; --surface-2: #242422; --border: #353532; --border-2: #4a4a46;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #96958c;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
  --div-pos: #3987e5; --div-neg: #e66767; --div-mid: #383835; --div-pos-2: #1c5cab; --div-neg-2: #8f3434;
  --good: #5fd35f; --good-bg: #16261a; --bad: #f08f8f; --bad-bg: #2c1717; --warn: #f2bf62; --warn-bg: #2b2210;
  --grid: #2c2c2a; --ref: #6b6a64; --accent: #3987e5;
}
* { box-sizing: border-box; }
body { margin: 0; }
.viz-root { background: var(--page); color: var(--text-primary); min-height: 100vh;
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.app { max-width: 1320px; margin: 0 auto; padding: 16px 20px 48px; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-bottom: 14px; }
.topbar h1 { font-size: 20px; margin: 0; } .topbar h1 span { color: var(--text-muted); font-weight: 400; font-size: 14px; }
.topbar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface-1); }
.seg button { border: 0; background: none; color: var(--text-secondary); padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.seg button.on { background: var(--text-primary); color: var(--surface-1); font-weight: 600; }
.btn { border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.meta { color: var(--text-muted); font-size: 12px; width: 100%; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 8px; margin-bottom: 14px; }
.metric { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; }
.metric .lbl { font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); }
.metric .val { font-size: 21px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
.metric .sub { font-size: 11px; color: var(--text-muted); }
.val.good { color: var(--good); } .val.bad { color: var(--bad); } .val.warn { color: var(--warn); }
nav.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); flex-wrap: wrap; margin-bottom: 14px; }
nav.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--text-secondary); padding: 9px 11px; font: inherit; cursor: pointer; }
nav.tabs button.on { color: var(--text-primary); border-bottom-color: var(--text-primary); font-weight: 600; }
section { display: none; } section.on { display: block; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
.card-title { font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--text-secondary); font-weight: 650; margin-bottom: 8px; }
.note { color: var(--text-secondary); font-size: 12.5px; margin: 6px 0 0; max-width: 980px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; font-size: 13px; color: var(--text-secondary); }
.filters select, .filters input { font: inherit; font-size: 13px; padding: 5px 7px; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 7px; }
.filters .count { margin-left: auto; font-style: italic; color: var(--text-muted); }
.tablewrap { overflow: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1); }
.tablewrap.scroll { max-height: 640px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 9px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; vertical-align: middle; }
th { color: var(--text-secondary); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; z-index: 1; font-size: 12px; }
th.sort { cursor: pointer; } th.sort:hover { color: var(--text-primary); }
td.l, th.l { text-align: left; } td.wrap { white-space: normal; }
tr.game { cursor: pointer; } tr.game:hover td { background: var(--surface-2); }
tr.detail > td { background: var(--page); padding: 10px 14px 14px; white-space: normal; text-align: left; }
.caret { color: var(--text-muted); width: 14px; display: inline-block; }
.chip { display: inline-block; min-width: 44px; text-align: center; border: 1px solid var(--border); border-radius: 10px; padding: 0 6px; font-size: 11.5px; color: var(--text-secondary); background: var(--surface-2); }
.badge { display: inline-block; border-radius: 6px; padding: 1px 7px; font-size: 11.5px; font-weight: 600; }
.badge.ok { color: var(--good); background: var(--good-bg); } .badge.ko { color: var(--bad); background: var(--bad-bg); }
.badge.pd { color: var(--warn); background: var(--warn-bg); } .badge.nt { color: var(--text-secondary); background: var(--surface-2); }
.hit1 { color: var(--good); font-weight: 600; } .hit0 { color: var(--bad); font-weight: 600; }
.muted { color: var(--text-muted); } .small { font-size: 12px; }
.mini { display: inline-flex; width: 64px; height: 7px; border-radius: 4px; overflow: hidden; gap: 2px; vertical-align: middle; margin-right: 6px; }
.detail-grid { display: grid; grid-template-columns: minmax(300px, 1.3fr) minmax(260px, 1fr); gap: 16px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 13px; }
.kv > span:nth-child(odd) { color: var(--text-secondary); }
.warn-line { color: var(--warn); font-size: 12.5px; margin-top: 6px; }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--text-secondary); margin: 2px 0 8px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend i.dash { height: 0; border-top: 2px dashed var(--ref); width: 14px; border-radius: 0; vertical-align: 3px; }
svg { display: block; } svg text { fill: var(--text-secondary); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .axis { stroke: var(--border-2); } svg .gridl { stroke: var(--grid); }
.chart { width: 100%; }
#tip { position: fixed; pointer-events: none; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 7px; padding: 6px 9px; font-size: 12px; box-shadow: 0 3px 10px #0004; display: none; z-index: 20; max-width: 280px; }
.hm td { text-align: center; font-size: 12px; } .hm td.cell { min-width: 64px; }
.empty { color: var(--text-muted); font-size: 13px; padding: 18px; text-align: center; }
@media (max-width: 760px) { .detail-grid { grid-template-columns: 1fr; } .grid2 { grid-template-columns: 1fr; } .app { padding: 12px; } }
</style>
</head>
<body>
<div class="viz-root"><div class="app">
  <div class="topbar">
    <h1>NBA Forescore <span>tracker</span></h1>
    <div class="right">
      <div class="seg" id="src"><button data-v="vivo">En vivo</button><button data-v="backtest">Backtest 2026-27</button></div>
      <button class="btn" id="theme" title="Cambiar tema claro/oscuro"></button>
    </div>
    <div class="meta" id="meta"></div>
  </div>
  <div class="metrics" id="metrics"></div>
  <nav class="tabs" id="tabs"></nav>
  <section id="t-partidos"></section>
  <section id="t-tendencias"></section>
  <section id="t-mercados"></section>
  <section id="t-calib"></section>
  <section id="t-estudio"></section>
  <section id="t-clv"></section>
  <section id="t-crit"></section>
  <section id="t-equipos"></section>
  <section id="t-datos"></section>
</div><div id="tip"></div></div>
<script src="data.js"></script>
<script>
'use strict';
const D = window.NBA || {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pct = (x, d = 1) => x == null || isNaN(x) ? '—' : (100 * x).toFixed(d) + '%';
const num = (x, d = 1) => x == null || isNaN(x) ? '—' : (+x).toFixed(d);
const sgn = (x, d = 1) => x == null || isNaN(x) ? '—' : (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(+x).toFixed(d);
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const BANDS = ['50-55', '55-60', '60-65', '65-70', '70-75', '75-80', '80-85', '85-90', '90+'];
const band = p => p >= .9 ? '90+' : p >= .5 ? BANDS[Math.floor((p - .5) / .05)] : '<50';
const MERCADOS = ['Ganador', 'Hándicap', 'Total', 'Puntos local', 'Puntos visita'];
const mercadoGrupo = (s, g) => s.mercado.startsWith('Puntos ') ? (s.mercado.endsWith(g.home) ? 'Puntos local' : 'Puntos visita') : s.mercado;
const hora = u => u ? new Date(u).toLocaleString('es-PE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: 'America/Lima' }) : '';

// ---------- tooltip
const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { tip.style.display = 'none'; return; }
  tip.innerHTML = t.dataset.tip; tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8) + 'px';
});

// ---------- tema
const setTheme = t => { document.documentElement.dataset.theme = t; localStorage.setItem('nba_theme', t); $('#theme').textContent = t === 'dark' ? '☀ Claro' : '☾ Oscuro'; };
setTheme(localStorage.getItem('nba_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

// ---------- fuente (en vivo / backtest)
let SRC = localStorage.getItem('nba_src') || ((D.partidos || []).some(g => g.selecciones.some(s => s.hit != null)) ? 'vivo' : 'backtest');
const games = () => (SRC === 'vivo' ? D.partidos : D.partidos_bt) || [];
const sels = (gs = games()) => gs.flatMap(g => g.selecciones.map(s => ({ ...s, g, grupo: mercadoGrupo(s, g) }))).filter(s => !s.g.tardia);
$('#src').onclick = e => { if (!e.target.dataset.v) return; SRC = e.target.dataset.v; localStorage.setItem('nba_src', SRC); renderAll(); };

const m = D.meta || {};
$('#meta').innerHTML = `Actualizado ${esc(m.generado)} · base ${Object.entries(m.partidos_base || {}).map(([s, n]) => `${s - 1}-${String(s).slice(2)}: ${n}`).join(' · ')} partidos · calibración ${esc((m.calib || []).join(', '))} · SD margen ${num(m.sd_margen)} · SD total ${num(m.sd_total)} · decisión por P% (EV y CLV son variables de estudio)`;

// ---------- pestañas
const TABS = [['partidos', 'Partidos'], ['tendencias', 'Tendencias'], ['mercados', 'Mercados'], ['calib', 'Calibración'],
  ['estudio', 'Estudio EV / CLV'], ['clv', 'CLV Betano'], ['crit', 'Descanso y bajas'], ['equipos', 'Por equipo'], ['datos', 'Datos']];
$('#tabs').innerHTML = TABS.map(([k, t]) => `<button data-k="${k}">${t}</button>`).join('');
const showTab = k => { document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === 't-' + k)); history.replaceState(null, '', '#' + k); };
$('#tabs').onclick = e => e.target.dataset.k && showTab(e.target.dataset.k);

// ---------- estadísticas comunes
function stats(ss) {
  const done = ss.filter(s => s.hit != null);
  const pl = done.filter(s => s.cuota).map(s => s.hit ? s.cuota - 1 : -1);
  return { n: ss.length, done: done.length, pend: ss.filter(s => s.hit == null).length,
    acierto: mean(done.map(s => s.hit)), p: mean(done.map(s => s.p)),
    brier: mean(done.map(s => (s.p - s.hit) ** 2)), pl: pl.reduce((a, x) => a + x, 0), roi: pl.length ? pl.reduce((a, x) => a + x, 0) / pl.length : null,
    ev: mean(ss.filter(s => s.ev_info != null).map(s => s.ev_info)) };
}

function renderMetrics() {
  const gs = games(), ss = sels(gs), s = stats(ss), dif = s.acierto != null ? s.acierto - s.p : null, c = D.clv || {};
  const M = (lbl, val, cls = '', sub = '') => `<div class="metric"><div class="lbl">${lbl}</div><div class="val ${cls}">${val}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
  $('#metrics').innerHTML = [
    M('Partidos', gs.length, '', SRC === 'vivo' ? 'en vivo' : 'backtest 2026-27'),
    M('Selecciones', s.n), M('Liquidadas', s.done), M('Pendientes', s.pend, s.pend ? 'warn' : ''),
    M('Acierto', pct(s.acierto)), M('P media', pct(s.p), '', 'lo prometido'),
    M('Calibración', dif == null ? '—' : sgn(100 * dif) + ' pp', dif == null ? '' : Math.abs(dif) <= .03 ? 'good' : 'warn', 'acierto − P media'),
    M('Brier', num(s.brier, 3), '', 'menor = mejor'),
    M('P&L teórico', s.done ? sgn(s.pl, 2) + 'u' : '—', s.pl >= 0 ? 'good' : 'bad', 'informativo · 1u'),
    M('CLV pre-salto', c.clv_pre_main == null ? '—' : sgn(100 * c.clv_pre_main) + '%', '', `${c.cierre_real ?? 0}/${c.partidos ?? 0} con cierre real`),
  ].join('');
}

// ---------- PARTIDOS
const st = { fecha: '', mercado: '', tramo: '', estado: '', equipo: '', open: new Set() };
function renderPartidos() {
  const gs = games().slice().reverse();
  const fechas = [...new Set(gs.map(g => g.fecha))];
  const el = $('#t-partidos');
  el.innerHTML = `<div class="filters">Filtrar:
    <select id="pf-fecha"><option value="">Todas las fechas</option>${fechas.map(f => `<option ${f === st.fecha ? 'selected' : ''}>${f}</option>`).join('')}</select>
    <select id="pf-merc"><option value="">Todos los mercados</option>${MERCADOS.map(x => `<option ${x === st.mercado ? 'selected' : ''}>${x}</option>`).join('')}</select>
    <select id="pf-tramo"><option value="">Todos los tramos</option>${BANDS.map(x => `<option ${x === st.tramo ? 'selected' : ''}>${x}</option>`).join('')}</select>
    <select id="pf-est"><option value="">Todos</option><option value="pend" ${st.estado === 'pend' ? 'selected' : ''}>Pendientes</option><option value="ok" ${st.estado === 'ok' ? 'selected' : ''}>Con acierto</option><option value="ko" ${st.estado === 'ko' ? 'selected' : ''}>Con fallo</option></select>
    <input id="pf-eq" placeholder="Equipo (ej. LAL)" size="12" value="${esc(st.equipo)}">
    <button class="btn" id="pf-clear">Limpiar</button><span class="count" id="pf-count"></span></div>
    <div class="tablewrap scroll"><table><thead><tr><th class="l"></th><th class="l">Fecha</th><th class="l">Partido</th><th class="l">Final</th>
    <th>P local</th><th>Línea justa</th><th>Margen esp. → real</th><th>Total esp. → real</th><th class="l">Selecciones</th><th></th></tr></thead><tbody id="pt-body"></tbody></table></div>
    <p class="note">Una fila por partido; clic para ver el detalle. P local = probabilidad final (mercado sin margen + modelo). Margen y total: lo esperado antes del salto → lo que pasó.
    ${SRC === 'backtest' ? 'Fuente backtest: predicciones walk-forward con líneas de cierre (sin fotos de Betano ni bajas por nombre).' : ''}</p>`;
  const bind = (id, k, ev = 'onchange') => { $(id)[ev] = e => { st[k] = e.target.value; drawRows(); }; };
  bind('#pf-fecha', 'fecha'); bind('#pf-merc', 'mercado'); bind('#pf-tramo', 'tramo'); bind('#pf-est', 'estado'); bind('#pf-eq', 'equipo', 'oninput');
  $('#pf-clear').onclick = () => { Object.assign(st, { fecha: '', mercado: '', tramo: '', estado: '', equipo: '' }); renderPartidos(); };
  drawRows();
  function drawRows() {
    const eq = st.equipo.trim().toUpperCase();
    const rows = gs.filter(g => (!st.fecha || g.fecha === st.fecha) && (!eq || g.home.includes(eq) || g.away.includes(eq)) &&
      g.selecciones.some(s => (!st.mercado || mercadoGrupo(s, g) === st.mercado) && (!st.tramo || band(s.p) === st.tramo) &&
        (!st.estado || (st.estado === 'pend' && s.hit == null) || (st.estado === 'ok' && s.hit === 1) || (st.estado === 'ko' && s.hit === 0))));
    $('#pf-count').textContent = `${rows.length} partidos`;
    $('#pt-body').innerHTML = rows.slice(0, 400).map(g => {
      const e = g.esperado || {}, r = g.real, ok = g.selecciones.filter(s => s.hit === 1).length, ko = g.selecciones.filter(s => s.hit === 0).length;
      const pend = g.selecciones.filter(s => s.hit == null).length, open = st.open.has(g.game_id);
      const ph = g.p_home ?? .5;
      const row = `<tr class="game" data-id="${esc(g.game_id)}"><td class="l"><span class="caret">${open ? '▼' : '▶'}</span></td>
        <td class="l">${esc(g.fecha)}</td><td class="l"><b>${esc(g.away)}</b> @ <b>${esc(g.home)}</b></td>
        <td class="l">${r ? `${r.pts_away}–${r.pts_home}` : `<span class="muted">${hora(g.start_utc)}</span>`}</td>
        <td><span class="mini"><span style="width:${100 * (1 - ph)}%;background:var(--series-2)"></span><span style="width:${100 * ph}%;background:var(--series-1)"></span></span>${pct(ph, 0)}</td>
        <td>${sgn(g.linea_justa)}</td><td>${sgn(e.margen)} → ${r ? sgn(r.margen, 0) : '…'}</td><td>${num(e.total)} → ${r ? r.total : '…'}</td>
        <td class="l">${ok ? `<span class="badge ok">${ok} ✓</span> ` : ''}${ko ? `<span class="badge ko">${ko} ✗</span> ` : ''}${pend ? `<span class="badge pd">${pend} pend.</span>` : ''}</td>
        <td>${(g.avisos || []).length ? `<span data-tip="${esc(g.avisos.join('<br>'))}">⚠</span>` : ''}</td></tr>`;
      return row + (open ? `<tr class="detail"><td colspan="10">${detail(g)}</td></tr>` : '');
    }).join('') || `<tr><td colspan="10" class="empty">Sin partidos con estos filtros${SRC === 'vivo' ? ' (en vivo el historial empieza el 2026-11-17)' : ''}.</td></tr>`;
    document.querySelectorAll('tr.game').forEach(tr => tr.onclick = () => { const id = tr.dataset.id; st.open.has(id) ? st.open.delete(id) : st.open.add(id); drawRows(); });
  }
}
function detail(g) {
  const e = g.esperado || {}, r = g.real;
  const rest = x => x ? `${x.days_rest ?? '?'} días${x.b2b === 1 ? ' · <b>B2B</b>' : ''}${(x.g_4d || 0) >= 3 ? ' · 3 en 4' : ''}${x.travel_km ? ' · ' + Math.round(x.travel_km) + ' km' : ''}` : '—';
  const bajas = side => g.bajas ? esc((g.bajas[side] || []).join(', ') || '—') : g.bajas_valor ? `valor perdido ${num(g.bajas_valor[side])} (Game Score)` : '—';
  const sl = g.selecciones.map(s => `<tr><td class="l">${esc(s.mercado)}</td><td class="l">${esc(s.seleccion)}</td><td><span class="chip">${band(s.p)}</span></td>
    <td>${pct(s.p)}</td><td>${s.cuota ? num(s.cuota, 2) : '—'}</td><td class="muted">${s.ev_info == null ? '' : sgn(100 * s.ev_info) + '%'}</td>
    <td>${s.hit === 1 ? '<span class="badge ok">✓ acierto</span>' : s.hit === 0 ? '<span class="badge ko">✗ fallo</span>' : '<span class="badge pd">pendiente</span>'}</td></tr>`).join('');
  return `<div class="detail-grid"><div><table><thead><tr><th class="l">Mercado</th><th class="l">Selección</th><th>Tramo</th><th>P</th><th>Cuota</th><th>EV info</th><th>Resultado</th></tr></thead><tbody>${sl}</tbody></table>
    ${(g.avisos || []).map(w => `<div class="warn-line">⚠ ${esc(w)}</div>`).join('')}</div>
    <div class="kv"><span>P ${esc(g.home)}</span><span>${pct(g.p_home)} <span class="muted">(mercado ${pct(g.p_mkt)} · modelo ${pct(g.p_model)})</span></span>
      <span>Puntos esperados</span><span>${esc(g.home)} ${num(e.pts_home)} · ${esc(g.away)} ${num(e.pts_away)}${r ? ` <span class="muted">(real ${r.pts_home}–${r.pts_away})</span>` : ''}</span>
      <span>Total IC 80 %</span><span>${num(e.ic80?.[0], 0)}–${num(e.ic80?.[1], 0)}${r ? ` <span class="muted">(real ${r.total})</span>` : ''}</span>
      <span>Descanso ${esc(g.home)}</span><span>${rest(g.descanso?.home)}</span><span>Descanso ${esc(g.away)}</span><span>${rest(g.descanso?.away)}</span>
      <span>Bajas ${esc(g.home)}</span><span>${bajas('home')}</span><span>Bajas ${esc(g.away)}</span><span>${bajas('away')}</span>
      <span>Cuotas</span><span>${esc(g.fuente_cuotas || '—')}</span></div></div>`;
}

// ---------- gráfico de líneas (un eje) con puntos con tooltip
function lineChart(series, { yfmt = v => v, ylab = '', zero = false, h = 260 } = {}) {
  const all = series.flatMap(s => s.pts);
  if (!all.length) return '<div class="empty">Sin datos liquidados todavía.</div>';
  const W = 900, H = h, L = 52, R = 16, T = 12, B = 34;
  const xs = all.map(p => p.x), ys = all.map(p => p.y).concat(zero ? [0] : []);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); if (y0 === y1) { y0 -= 1; y1 += 1; } const pad = (y1 - y0) * .08; y0 -= pad; y1 += pad;
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || 1;
  const sx = v => L + (x1 === x0 ? 0.5 : (v - x0) / (x1 - x0)) * (W - L - R), sy = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">`;
  for (let i = 0; i <= 4; i++) { const v = y0 + (y1 - y0) * i / 4; s += `<line class="gridl" x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${L - 6}" y="${sy(v) + 4}" text-anchor="end">${yfmt(v)}</text>`; }
  if (zero && y0 < 0 && y1 > 0) s += `<line x1="${L}" x2="${W - R}" y1="${sy(0)}" y2="${sy(0)}" stroke="var(--ref)" stroke-width="1.5"/>`;
  const lab = series[0].pts; const step = Math.max(1, Math.ceil(lab.length / 8));
  lab.forEach((p, i) => { if (i % step === 0) s += `<text x="${sx(p.x)}" y="${H - 12}" text-anchor="middle">${esc(p.lbl || '')}</text>`; });
  series.forEach(se => {
    s += `<polyline fill="none" stroke="${se.c}" stroke-width="2" ${se.dash ? 'stroke-dasharray="5 4"' : ''} points="${se.pts.map(p => sx(p.x) + ',' + sy(p.y)).join(' ')}"/>`;
    if (se.pts.length <= 120) se.pts.forEach(p => s += `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="3.5" fill="${se.c}" stroke="var(--surface-1)" stroke-width="1.5"/>`);
  });
  // franjas de hover por x (cruz): una por punto de la primera serie
  lab.forEach((p, i) => { const xa = i ? (sx(lab[i - 1].x) + sx(p.x)) / 2 : L, xb = i < lab.length - 1 ? (sx(p.x) + sx(lab[i + 1].x)) / 2 : W - R;
    const tt = series.map(se => { const q = se.pts[i]; return q ? `${esc(se.name)}: <b>${yfmt(q.y)}</b>` : ''; }).join('<br>');
    s += `<rect x="${xa}" y="${T}" width="${Math.max(1, xb - xa)}" height="${H - T - B}" fill="transparent" data-tip="<b>${esc(p.lbl || '')}</b>${p.extra ? ' · ' + esc(p.extra) : ''}<br>${tt}"/>`; });
  return s + '</svg>';
}

// ---------- TENDENCIAS
function renderTendencias() {
  const done = sels().filter(s => s.hit != null).sort((a, b) => (a.g.fecha + a.g.start_utc).localeCompare(b.g.fecha + b.g.start_utc));
  const byDay = {}; done.forEach(s => (byDay[s.g.fecha] ||= []).push(s));
  let ca = 0, ce = 0, cp = 0; const p1 = [], p3 = [];
  Object.entries(byDay).forEach(([d, ss], i) => { ss.forEach(s => { ca += s.hit; ce += s.p; cp += s.cuota ? (s.hit ? s.cuota - 1 : -1) : 0; });
    p1.push({ x: i, y: ca - ce, lbl: d.slice(5), extra: `${ss.length} selecciones` }); p3.push({ x: i, y: cp, lbl: d.slice(5) }); });
  const W = 60, ra = [], rp = [];
  for (let i = W - 1; i < done.length; i += Math.max(1, Math.floor(done.length / 150))) {
    const w = done.slice(i - W + 1, i + 1); ra.push({ x: i, y: mean(w.map(s => s.hit)), lbl: w[w.length - 1].g.fecha.slice(5) }); rp.push({ x: i, y: mean(w.map(s => s.p)), lbl: w[w.length - 1].g.fecha.slice(5) }); }
  $('#t-tendencias').innerHTML = `
    <div class="card"><div class="card-title">Aciertos sobre lo esperado (acumulado)</div>
      ${lineChart([{ name: 'aciertos − P esperadas', c: 'var(--series-1)', pts: p1 }], { yfmt: v => sgn(v), zero: true, ylab: 'selecciones' })}
      <p class="note">Suma de (acierto − P) de todas las selecciones liquidadas. Si la P% es honesta, la línea oscila alrededor de 0; si sube sostenidamente, el sistema acierta más de lo que promete (subestima); si baja, promete de más.</p></div>
    <div class="card"><div class="card-title">Acierto móvil vs P media (ventana ${W} selecciones)</div>
      <div class="legend"><span><i style="background:var(--series-1)"></i>Acierto real</span><span><i style="background:var(--series-2)"></i>P media prometida</span></div>
      ${ra.length ? lineChart([{ name: 'Acierto', c: 'var(--series-1)', pts: ra }, { name: 'P media', c: 'var(--series-2)', pts: rp, dash: true }], { yfmt: v => pct(v, 0) }) : `<div class="empty">Hacen falta ${W} selecciones liquidadas.</div>`}</div>
    <div class="card"><div class="card-title">P&L teórico acumulado (1u por selección · informativo)</div>
      ${lineChart([{ name: 'P&L', c: 'var(--series-3)', pts: p3 }], { yfmt: v => sgn(v) + 'u', zero: true })}
      <p class="note">Lo que habría dado apostar 1u a cada selección registrada, a la cuota registrada. El sistema no decide por esto: se muestra para comparar con el criterio de P%.</p></div>`;
}

// ---------- MERCADOS
function divColor(v, scale) { // azul = acierta más de lo prometido, rojo = menos; gris = neutro
  const t = Math.max(-1, Math.min(1, v / scale));
  if (Math.abs(t) < .15) return 'var(--div-mid)';
  return Math.abs(t) < .55 ? (t > 0 ? 'var(--div-pos-2)' : 'var(--div-neg-2)') : (t > 0 ? 'var(--div-pos)' : 'var(--div-neg)');
}
function renderMercados() {
  const ss = sels(), rows = MERCADOS.map(mk => ({ mk, ...stats(ss.filter(s => s.grupo === mk)) })).filter(r => r.n);
  const hm = MERCADOS.filter(mk => ss.some(s => s.grupo === mk)).map(mk => `<tr><td class="l"><b>${mk}</b></td>` + BANDS.map(b => {
    const c = ss.filter(s => s.grupo === mk && band(s.p) === b && s.hit != null);
    if (!c.length) return '<td class="cell muted">·</td>';
    const a = mean(c.map(s => s.hit)), p = mean(c.map(s => s.p)), d = a - p, strong = Math.abs(d / .15) >= .55;   // celdas de color fuerte llevan texto claro
    return `<td class="cell" style="background:${divColor(d, .15)};${strong ? 'color:#fff;' : ''}" data-tip="<b>${mk}</b> · tramo ${b}<br>acierto ${pct(a)} vs P ${pct(p)}<br>diferencia ${sgn(100 * d)} pp · n = ${c.length}">${sgn(100 * d, 0)}<div class="small" style="opacity:.8">n ${c.length}</div></td>`;
  }).join('') + '</tr>').join('');
  $('#t-mercados').innerHTML = `<div class="card"><div class="card-title">Rendimiento por mercado</div>
    <div class="tablewrap"><table><thead><tr><th class="l">Mercado</th><th>Selecciones</th><th>Liquidadas</th><th>P media</th><th>Acierto</th><th>Acierto − P</th><th>Brier</th><th>P&L teórico</th><th>ROI teórico</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td class="l"><b>${r.mk}</b></td><td>${r.n}</td><td>${r.done}</td><td>${pct(r.p)}</td><td>${pct(r.acierto)}</td>
      <td class="${r.acierto - r.p > .03 ? 'hit1' : r.acierto - r.p < -.03 ? 'hit0' : ''}">${r.acierto == null ? '—' : sgn(100 * (r.acierto - r.p)) + ' pp'}</td><td>${num(r.brier, 3)}</td><td>${r.done ? sgn(r.pl, 2) + 'u' : '—'}</td><td>${r.roi == null ? '—' : sgn(100 * r.roi) + '%'}</td></tr>`).join('') || '<tr><td colspan="9" class="empty">Sin selecciones.</td></tr>'}
    </tbody></table></div></div>
    <div class="card"><div class="card-title">Mercado × tramo de P% — acierto menos lo prometido (pp)</div>
      <div class="legend"><span><i style="background:var(--div-pos)"></i>acierta más de lo prometido</span><span><i style="background:var(--div-mid);border:1px solid var(--border)"></i>calibrado (±2 pp)</span><span><i style="background:var(--div-neg)"></i>promete de más</span></div>
      <div class="tablewrap"><table class="hm"><thead><tr><th class="l">Mercado</th>${BANDS.map(b => `<th>${b}</th>`).join('')}</tr></thead><tbody>${hm || '<tr><td class="empty" colspan="10">Sin datos.</td></tr>'}</tbody></table></div>
      <p class="note">Cada celda: acierto real − P media del tramo, en puntos porcentuales, con su n. Con n &lt; 30 el color orienta pero no concluye.</p></div>`;
}

// ---------- CALIBRACIÓN
function calibChart(series) {
  const W = 620, H = 360, L = 50, R = 16, T = 14, B = 42;
  const sx = v => L + (v - .5) / .5 * (W - L - R), sy = v => T + (1 - (v - .3) / .7) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="Calibración">`;
  for (let v = .3; v <= 1.001; v += .1) s += `<line class="gridl" x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}"/><text x="${L - 6}" y="${sy(v) + 4}" text-anchor="end">${Math.round(v * 100)}%</text>`;
  for (let v = .5; v <= 1.001; v += .1) s += `<text x="${sx(v)}" y="${H - B + 16}" text-anchor="middle">${Math.round(v * 100)}%</text>`;
  s += `<text x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle">P% prometida (media del tramo) · eje vertical: acierto real</text>`;
  s += `<line x1="${sx(.5)}" y1="${sy(.5)}" x2="${sx(1)}" y2="${sy(1)}" stroke="var(--ref)" stroke-dasharray="4 4" stroke-width="1.5"/>`;
  series.forEach(se => { const pts = se.rows.filter(r => r.acierto != null && r.p_media >= .5);
    if (pts.length > 1) s += `<polyline fill="none" stroke="${se.c}" stroke-width="2" points="${pts.map(r => sx(r.p_media) + ',' + sy(Math.max(.3, r.acierto))).join(' ')}"/>`;
    pts.forEach(r => { const t = `<b>${esc(se.name)}</b> · tramo ${esc(r.tramo)}<br>P media ${pct(r.p_media)} · acierto ${pct(r.acierto)}<br>n = ${r.n}`;
      s += `<circle cx="${sx(r.p_media)}" cy="${sy(Math.max(.3, r.acierto))}" r="${Math.max(4, Math.min(9, Math.sqrt(r.n) / 2.2))}" fill="${se.c}" stroke="var(--surface-1)" stroke-width="2"/>
        <circle cx="${sx(r.p_media)}" cy="${sy(Math.max(.3, r.acierto))}" r="14" fill="transparent" data-tip="${t}"/>`; }); });
  return s + '</svg>';
}
function bandRows(ss) { return BANDS.map(b => { const c = ss.filter(s => band(s.p) === b && s.hit != null); return c.length ? { tramo: b, n: c.length, p_media: mean(c.map(s => s.p)), acierto: mean(c.map(s => s.hit)) } : null; }).filter(Boolean); }
function bandTable(rows, extra) {
  if (!rows.length) return '<div class="empty">Sin selecciones liquidadas.</div>';
  return `<div class="tablewrap"><table><thead><tr><th class="l">Tramo</th><th>n</th><th>P media</th><th>Acierto</th><th>Dif.</th>${extra ? `<th>n ${extra} &gt; 0</th><th>Acierto ${extra} &gt; 0</th><th>n ${extra} ≤ 0</th><th>Acierto ${extra} ≤ 0</th><th>Separa</th>` : ''}</tr></thead><tbody>` +
    rows.map(r => { const sep = r.acierto_pos != null && r.acierto_neg != null ? r.acierto_pos - r.acierto_neg : null;
      return `<tr><td class="l">${esc(r.tramo)}</td><td>${r.n}</td><td>${pct(r.p_media)}</td><td>${pct(r.acierto)}</td><td>${sgn(100 * (r.acierto - r.p_media))} pp</td>${extra ? `<td>${r.n_pos ?? '—'}</td><td>${pct(r.acierto_pos)}</td><td>${r.n_neg ?? '—'}</td><td>${pct(r.acierto_neg)}</td><td class="${r.n_pos >= 30 && r.n_neg >= 30 ? (sep > .05 ? 'hit1' : sep < -.05 ? 'hit0' : '') : 'muted'}" ${r.n_pos < 30 || r.n_neg < 30 ? 'data-tip="Algún grupo tiene n &lt; 30: no concluye"' : ''}>${sep == null ? '—' : sgn(100 * sep) + ' pp'}</td>` : ''}</tr>`; }).join('') + '</tbody></table></div>';
}
let calibMk = '';
function renderCalib() {
  const bt = D.backtest || {}, ss = sels().filter(s => !calibMk || s.grupo === calibMk);
  const series = [{ name: 'Backtest 2024-26 (ganador)', c: 'var(--series-1)', rows: bt.calibracion?.tabla || [] },
    { name: 'Backtest 2026-27 (ganador)', c: 'var(--series-2)', rows: bt.prueba?.tabla || [] },
    { name: `${SRC === 'vivo' ? 'En vivo' : 'Fuente backtest'} · ${calibMk || 'todos los mercados'}`, c: 'var(--series-3)', rows: bandRows(ss) }];
  const ll = k => bt[k] ? `<tr><td class="l">${k === 'calibracion' ? 'Calibración 2024-26' : 'Prueba 2026-27'}</td><td>${bt[k].n}</td><td>${num(bt[k].logloss.mercado, 4)}</td><td>${num(bt[k].logloss.modelo, 4)}</td><td>${num(bt[k].logloss.mezcla, 4)}</td><td>${num(bt[k].brier.mercado, 4)}</td><td>${num(bt[k].brier.modelo, 4)}</td><td>${num(bt[k].brier.mezcla, 4)}</td></tr>` : '';

    <div class="legend">${series.map(s => `<span><i style="background:${s.c}"></i>${esc(s.name)}</span>`).join('')}<span><i class="dash"></i>calibración perfecta</span></div>
    ${calibChart(series)}<p class="note">Si la P% es honesta, los puntos caen sobre la diagonal: el tramo 70-75 % acierta ~72 %. El tamaño del punto crece con n.</p></div>
    <div class="grid2"><div class="card"><div class="card-title">Tabla — ${esc(series[2].name)}</div>${bandTable(bandRows(ss))}</div>
    <div class="card"><div class="card-title">Ganador: mercado vs modelo vs mezcla (log-loss y Brier, menor = mejor)</div>
      <div class="tablewrap"><table><thead><tr><th class="l">Muestra</th><th>n</th><th>LL mercado</th><th>LL modelo</th><th>LL mezcla</th><th>Brier mercado</th><th>Brier modelo</th><th>Brier mezcla</th></tr></thead><tbody>${ll('calibracion')}${ll('prueba')}</tbody></table></div>
      <p class="note">Hoy el cierre del mercado sigue siendo la referencia más difícil de batir; el modelo propio aporta poco y se mezcla con peso ${num(1 - (m.w_mercado ?? .8), 2)}.</p></div></div>`;
  $('#cal-mk').onchange = e => { calibMk = e.target.value; renderCalib(); };
}

// ---------- ESTUDIO EV / CLV (¿separan dentro de cada tramo?)
function sepRows(ss, f) { return BANDS.map(b => { const c = ss.filter(s => band(s.p) === b && s.hit != null && f(s) != null); if (!c.length) return null;
  const pos = c.filter(s => f(s) > 0), neg = c.filter(s => f(s) <= 0);
  return { tramo: b, n: c.length, p_media: mean(c.map(s => s.p)), acierto: mean(c.map(s => s.hit)), n_pos: pos.length, acierto_pos: pos.length ? mean(pos.map(s => s.hit)) : null, n_neg: neg.length, acierto_neg: neg.length ? mean(neg.map(s => s.hit)) : null }; }).filter(Boolean); }
function renderEstudio() {
  const ss = sels(), win = ss.filter(s => s.grupo === 'Ganador');
  const difMk = s => s.g.p_mkt == null ? null : (s.side === 'home' ? s.g.p_home - s.g.p_mkt : s.g.p_mkt - s.g.p_home);
  $('#t-estudio').innerHTML = `<p class="note" style="margin-bottom:12px">Criterio del sistema: <b>se decide por P%</b>. Una variable (EV, edge, CLV) solo pasaría a filtrar si, <b>dentro del mismo tramo de P%</b>,
    las selecciones con valor positivo aciertan claramente más que las de valor ≤ 0, de forma estable y con muestras grandes. Columna "Separa" = diferencia de acierto entre ambos grupos.</p>
    <div class="card"><div class="card-title">EV informativo (todas las selecciones)</div>${bandTable(sepRows(ss, s => s.ev_info), 'EV')}</div>
    <div class="card"><div class="card-title">Ganador: P final − P de mercado (¿el modelo propio aporta?)</div>${bandTable(sepRows(win, difMk), 'dif')}</div>
    <div class="card"><div class="card-title">CLV de Betano (líneas principales, todas las fotos)</div>${bandTable((D.clv?.clv_separa || []).map(r => ({ ...r })), 'CLV')}
      <p class="note">Tramo = P justa de Betano al tomar la foto. Pocas filas hasta que se acumulen cierres reales.</p></div>`;
}

// ---------- barras divergentes con escala fija
function divBars(rows, label, value, fmt, tipf, unit, dom) {
  if (!rows.length) return '<div class="empty">Sin datos.</div>';
  const W = 640, rowH = 26, L = 210, R = 70, H = rows.length * rowH + 30, mx = Math.max(dom || 1e-9, ...rows.map(r => Math.abs(value(r) || 0)));
  const sx = v => L + (W - L - R) / 2 + v / mx * (W - L - R) / 2, z = sx(0);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">`;
  s += `<line class="axis" x1="${z}" x2="${z}" y1="6" y2="${H - 20}"/><text x="${z}" y="${H - 6}" text-anchor="middle">0</text>
    <text x="${sx(-mx)}" y="${H - 6}" text-anchor="start">−${+mx.toFixed(1)} ${unit}</text><text x="${sx(mx)}" y="${H - 6}" text-anchor="end">+${+mx.toFixed(1)} ${unit}</text>`;
  rows.forEach((r, i) => { const v = value(r) || 0, y = 8 + i * rowH, x = Math.min(z, sx(v)), w = Math.abs(sx(v) - z);
    s += `<text x="${L - 8}" y="${y + 14}" text-anchor="end">${esc(label(r))}</text><rect x="${x}" y="${y + 5}" width="${Math.max(w, 1.5)}" height="14" rx="3" fill="var(${v >= 0 ? '--div-pos' : '--div-neg'})"/>
      <text x="${W - 6}" y="${y + 14}" text-anchor="end">${fmt(v)}</text><rect x="0" y="${y}" width="${W}" height="${rowH}" fill="transparent" data-tip="${tipf(r)}"/>`; });
  return s + '</svg>';
}

// ---------- CLV
function renderCLV() {
  const c = D.clv || {}, rows = (c.por_mercado || []).filter(r => r.clv != null);
  $('#t-clv').innerHTML = `<div class="card"><div class="card-title">CLV medio por mercado y momento de la foto</div>
    <div class="legend"><span><i style="background:var(--div-pos)"></i>CLV positivo</span><span><i style="background:var(--div-neg)"></i>CLV negativo</span></div>
    ${divBars(rows, r => `${r.grupo} · ${r.momento}`, r => 100 * r.clv, v => sgn(v) + '%', r => `<b>${esc(r.grupo)}</b> · ${esc(r.momento)}<br>CLV ${sgn(100 * r.clv)}% · CLV&gt;0 ${pct(r.pos)}<br>vs DraftKings ${r.clv_dk == null ? '—' : sgn(100 * r.clv_dk) + '%'} · n = ${r.n}`, '%', 10)}
    <p class="note">CLV = cuota tomada × P justa del cierre − 1. Cierre = última foto de Betano antes del salto (${c.cierre_real ?? 0} de ${c.partidos ?? 0} partidos con cierre real). Si la línea no se mueve, CLV ≈ −margen de Betano (−2 a −5 % en principales, −10 a −15 % en alternativas extremas): es lo normal. CLV sostenido &gt; 0 en algún momento del día sería la primera señal de ventaja.</p></div>
    <div class="card"><div class="card-title">Tabla</div><div class="tablewrap"><table><thead><tr><th class="l">Mercado</th><th class="l">Momento</th><th>n</th><th>CLV Betano</th><th>CLV &gt; 0</th><th>CLV vs DK</th><th>Mov. precio (props)</th></tr></thead><tbody>
    ${(c.por_mercado || []).map(r => `<tr><td class="l">${esc(r.grupo)}</td><td class="l">${esc(r.momento)}</td><td>${r.n}</td><td>${r.clv == null ? '—' : sgn(100 * r.clv) + '%'}</td><td>${pct(r.pos)}</td><td>${r.clv_dk == null ? '—' : sgn(100 * r.clv_dk) + '%'}</td><td>${r.mov == null ? '—' : sgn(100 * r.mov, 2) + '%'}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">Sin CLV todavía.</td></tr>'}</tbody></table></div></div>`;
}

// ---------- DESCANSO Y BAJAS
function renderCrit() {
  const k = D.criticas || {};
  const tbl = rows => `<div class="tablewrap"><table><thead><tr><th class="l">Grupo</th><th>n</th><th>Gana local</th><th>P mercado</th><th>Diferencia</th><th>Cubre local</th><th>Residuo vs línea</th></tr></thead><tbody>` +
    rows.map(r => `<tr><td class="l">${esc(r.grupo)}</td><td>${r.n}</td><td>${pct(r.gana_local)}</td><td>${pct(r.p_mercado)}</td><td>${sgn(100 * (r.gana_local - r.p_mercado))} pp</td><td>${pct(r.cubre_local)}</td><td>${sgn(r.resid_vs_linea)} pts</td></tr>`).join('') + '</tbody></table></div>';
  const block = (t, rows) => `<div class="card"><div class="card-title">${t}</div><div class="grid2"><div>${divBars(rows, r => r.grupo, r => r.resid_vs_linea, v => sgn(v) + ' pts',
    r => `<b>${esc(r.grupo)}</b> (n = ${r.n})<br>gana local ${pct(r.gana_local)} vs mercado ${pct(r.p_mercado)}<br>cubre ${pct(r.cubre_local)} · residuo ${sgn(r.resid_vs_linea)} pts`, 'pts', 3)}</div><div>${tbl(rows)}</div></div></div>`;
  $('#t-crit').innerHTML = `<p class="note" style="margin-bottom:12px">¿El mercado ya incorpora el descanso y las bajas? Residuo vs línea = margen local + hándicap de cierre (positivo: el local rindió más de lo que decía la línea).
    Escala fija ±3 puntos: un efecto chico se ve chico. ${k.n || 0} partidos de temporada regular 2024-27. Bajas = valor (Game Score) de la rotación que no jugó.</p>
    ${block('Back-to-back', k.b2b || [])}${block('Diferencia de días de descanso', k.descanso_dif || [])}${block('Bajas de la rotación', k.bajas || [])}`;
}

// ---------- POR EQUIPO
let eqSort = ['n', -1];
function renderEquipos() {
  const T = {};
  games().filter(g => g.real && g.esperado?.margen != null).forEach(g => [['home', 1], ['away', -1]].forEach(([side, sg]) => {
    const t = g[side], e = (T[t] ||= { eq: t, n: 0, err: [], aerr: [], terr: [], pick: [], ptot: [] });
    e.n++; e.err.push(sg * (g.real.margen - g.esperado.margen)); e.aerr.push(Math.abs(g.real.margen - g.esperado.margen)); e.terr.push(g.real.total - g.esperado.total);
    const w = g.selecciones.find(s => s.market === 'ml'); if (w && w.hit != null && (w.side === side)) { e.pick.push(w.hit); e.ptot.push(w.p); }
  }));
  const rows = Object.values(T).map(e => ({ eq: e.eq, n: e.n, sesgo: mean(e.err), mae: mean(e.aerr), sesgo_t: mean(e.terr), npick: e.pick.length, acierto: mean(e.pick), p: mean(e.ptot) }));
  const [k, dir] = eqSort; rows.sort((a, b) => ((a[k] ?? -1e9) > (b[k] ?? -1e9) ? 1 : -1) * dir);
  const H = (key, txt, cls = '') => `<th class="sort ${cls}" data-k="${key}">${txt}${eqSort[0] === key ? (eqSort[1] > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  const bar = (v, sc) => `<span style="display:inline-block;width:60px;height:8px;position:relative;vertical-align:middle;margin-right:6px;background:var(--surface-2);border-radius:4px">
    <span style="position:absolute;top:0;height:8px;border-radius:3px;${v >= 0 ? 'left:30px' : 'right:30px'};width:${Math.min(30, Math.abs(v) / sc * 30)}px;background:var(${v >= 0 ? '--div-pos' : '--div-neg'})"></span></span>`;
  $('#t-equipos').innerHTML = `<div class="card"><div class="card-title">¿Con quién falla el modelo? (${SRC === 'vivo' ? 'en vivo' : 'backtest 2026-27'})</div>
    <div class="tablewrap scroll"><table><thead><tr>${H('eq', 'Equipo', 'l')}${H('n', 'Partidos')}${H('sesgo', 'Rinde vs esperado (margen)')}${H('mae', 'Error medio |margen|')}${H('sesgo_t', 'Total real − esperado')}${H('npick', 'Veces favorito')}${H('p', 'P media')}${H('acierto', 'Acierto como favorito')}</tr></thead><tbody>
    ${rows.map(r => `<tr><td class="l"><b>${esc(r.eq)}</b></td><td>${r.n}</td><td>${bar(r.sesgo, 8)}${sgn(r.sesgo)} pts</td><td>${num(r.mae)}</td><td>${bar(r.sesgo_t, 12)}${sgn(r.sesgo_t)}</td><td>${r.npick}</td><td>${pct(r.p)}</td><td>${pct(r.acierto)}</td></tr>`).join('') || '<tr><td colspan="8" class="empty">Sin partidos liquidados.</td></tr>'}
    </tbody></table></div><p class="note">"Rinde vs esperado" desde el punto de vista del equipo: positivo = ganó por más (o perdió por menos) de lo que esperaba el sistema. Con menos de ~15 partidos por equipo es ruido; sirve para detectar equipos donde el modelo falla de forma repetida (lesiones largas, cambios de plantilla).</p></div>`;
  document.querySelectorAll('#t-equipos th.sort').forEach(th => th.onclick = () => { eqSort = [th.dataset.k, eqSort[0] === th.dataset.k ? -eqSort[1] : -1]; renderEquipos(); });
}

// ---------- DATOS
function renderDatos() {
  const d = D.datos || {};
  $('#t-datos').innerHTML = `<div class="grid2"><div class="card"><div class="card-title">Fuentes — última lectura correcta</div><div class="tablewrap"><table><thead><tr><th class="l">Fuente</th><th class="l">Última OK (UTC)</th><th>Lecturas 24 h</th><th>Errores 24 h</th></tr></thead><tbody>
    ${(d.fuentes || []).map(f => `<tr><td class="l">${esc(f.fuente)}</td><td class="l">${esc((f.ultima_ok || '—').replace('T', ' ').replace('Z', ''))}</td><td>${f.lecturas_24h}</td><td class="${f.errores_24h ? 'hit0' : ''}">${f.errores_24h}</td></tr>`).join('')}</tbody></table></div>
    <p class="note">Errores esperables: stats.nba.com / cdn.nba.com bloquean desde esta red (no se usan). Un reporte de lesiones que no existe para un cuarto de hora también cuenta como error.</p></div>
    <div class="card"><div class="card-title">Estado del día</div><div class="kv">
      <span>Último reporte oficial de lesiones</span><span>${esc(d.reporte_lesiones || '—')}</span>
      <span>NOT YET SUBMITTED</span><span>${esc((d.not_yet_submitted || []).join(', ') || 'ninguno')}</span>
      <span>Titulares NBA (última lectura)</span><span>${esc(d.titulares?.ultima || '—')} · día ${esc(d.titulares?.dia || '—')}</span>
      <span>Partidos sin box score</span><span class="${d.partidos_sin_box ? 'hit0' : ''}">${d.partidos_sin_box ?? '—'}</span></div>
      <div class="card-title" style="margin-top:14px">Fotos de Betano por día de partido</div>
      <div class="tablewrap"><table><thead><tr><th class="l">Día (UTC)</th><th>Fotos (partido × momento)</th></tr></thead><tbody>${(d.fotos_betano || []).map(f => `<tr><td class="l">${esc(f.dia)}</td><td>${f.fotos}</td></tr>`).join('') || '<tr><td colspan="2" class="empty">—</td></tr>'}</tbody></table></div></div></div>`;
}

function renderAll() {
  document.querySelectorAll('#src button').forEach(b => b.classList.toggle('on', b.dataset.v === SRC));
  renderMetrics(); renderPartidos(); renderTendencias(); renderMercados(); renderCalib(); renderEstudio(); renderCLV(); renderCrit(); renderEquipos(); renderDatos();
}
renderAll();
showTab((location.hash || '#partidos').slice(1));
</script>
